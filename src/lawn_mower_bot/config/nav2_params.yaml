bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_xml_filename: "navigate_w_replanning_and_recovery.xml"
    default_bt_xml_filename: "pkg://nav2_bt_navigator/behavior_trees/navigate_w_replanning_and_recovery.xml"

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    # RPP handles velocity limits internally, but we set safe defaults here
    min_x_velocity: 0.0
    min_y_velocity: 0.0
    min_theta_velocity: 0.0
    max_x_velocity: 1.5
    max_y_velocity: 0.0
    max_theta_velocity: 3.0
    
    progress_checker_plugin: "progress_checker"
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.05  
      movement_time_allowance: 20.0   

    goal_checker_plugins: ["goal_checker"]
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15  # Allow finishing within 15cm of the exact spot
      yaw_goal_tolerance: 0.25 # Require exact vehicle heading at the waypoint before calling it done
      stateful: True

    transform_tolerance: 1.0

    # FIX: SWITCHED TO REGULATED PURE PURSUIT (RPP)
    # This controller is much simpler and robust for differential drive robots.
    controller_plugins: ["FollowPath"]
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      
      # DRIVING SPEEDS
      desired_linear_vel: 1.5
      min_approach_linear_velocity: 0.1
      
      # LOOKAHEAD (The "Carrot")
      # It will look ahead. If the path turns, it steers towards that point.
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 1.5
      lookahead_time: 1.0
      
      # ROTATION LOGIC 
      # Very small angle to force the robot to STOP and rotate in place 
      # before moving forward again, creating point-turns.
      rotate_to_heading_min_angle: 0.1
      
      # VELOCITY SCALING (Curvature & Approach)
      # Slow the robot from 1.5 m/s down to 0.3 m/s on sharp turns, and slow down as it approaches targets.
      use_regulated_linear_velocity_scaling: true
      regulated_linear_velocity_scaling_min_radius: 0.6
      regulated_linear_velocity_scaling_min_speed: 0.3
      use_approach_linear_velocity_scaling: true
      approach_velocity_scaling_dist: 0.8
      
      # SAFETY
      use_collision_detection: true # Re-enabling collision detection so it avoids clipping the tree
      max_allowed_time_to_collision_up_to_carrot: 0.3
      
      # TUNING
      transform_tolerance: 1.0
      use_velocity_scaled_lookahead_dist: true
      approach_velocity_scaling_dist: 0.6
      
      # DYNAMICS
      max_linear_accel: 1.5
      max_angular_accel: 3.2

planner_server:
  ros__parameters:
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner::SmacPlanner2D"
      tolerance: 0.5
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 1.0
      motion_model_for_search: "MOORE" # Use purely grid-based horizontal/vertical straight lines
      angle_quantization_bins: 16
      analytic_expansion_ratio: 3.5
      minimum_turning_radius: 0.2
      reverse_penalty: 2.0
      cache_obstacle_map: true
      lookup_table_size: 20.0

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: True
      footprint: "[[-0.25, -0.2], [0.25, -0.2], [0.25, 0.2], [-0.25, 0.2]]"
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        # Receives map from SLAM toolbox on /map topic
        map_topic: /map
        subscribe_to_updates: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 12.0
          raytrace_min_range: 0.15
          obstacle_max_range: 11.5
          obstacle_min_range: 0.2
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 15.0
        inflation_radius: 0.35
      always_send_full_costmap: True

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: True
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      footprint: "[[-0.25, -0.2], [0.25, -0.2], [0.25, 0.2], [-0.25, 0.2]]"
      track_unknown_space: false
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 12.0
          raytrace_min_range: 0.15
          obstacle_max_range: 11.5
          obstacle_min_range: 0.2
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 15.0
        inflation_radius: 0.35
      always_send_full_costmap: True
  local_costmap_client:
    ros__parameters:
      use_sim_time: True
  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: True

map_server:
  ros__parameters:
    use_sim_time: True
    yaml_filename: "" 

behavior_server:
  ros__parameters:
    use_sim_time: True
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    wait:
      plugin: "nav2_behaviors::Wait"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 1.0
    simulate_ahead_time: 0.5
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: true
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 0